<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamagotchi</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#87CEEB;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

#game{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    width:350px;
    text-align:center;
}

#pet{
    font-size:90px;
    margin:10px;
}

.stat{
    margin:10px 0;
}

.bar{
    width:100%;
    height:20px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    transition:0.3s;
}

button{
    margin:5px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.feed{background:#4CAF50;color:white;}
.play{background:#2196F3;color:white;}
.sleep{background:#9C27B0;color:white;}

#message{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">
    <h1>Tamagotchi</h1>

    <div id="pet">🐣</div>

    <div class="stat">
        Hunger
        <div class="bar">
            <div id="hungerBar" class="fill" style="background:#4CAF50;width:100%"></div>
        </div>
    </div>

    <div class="stat">
        Happiness
        <div class="bar">
            <div id="happyBar" class="fill" style="background:#2196F3;width:100%"></div>
        </div>
    </div>

    <div class="stat">
        Energy
        <div class="bar">
            <div id="energyBar" class="fill" style="background:#9C27B0;width:100%"></div>
        </div>
    </div>

    <p>Age: <span id="age">0</span></p>

    <button class="feed" onclick="feedPet()">🍎 Feed</button>
    <button class="play" onclick="playPet()">⚽ Play</button>
    <button class="sleep" onclick="sleepPet()">😴 Sleep</button>

    <div id="message">Take care of your pet!</div>
</div>

<script>

let hunger = 100;
let happiness = 100;
let energy = 100;
let age = 0;
let alive = true;

function updateBars(){
    document.getElementById("hungerBar").style.width = hunger + "%";
    document.getElementById("happyBar").style.width = happiness + "%";
    document.getElementById("energyBar").style.width = energy + "%";
    document.getElementById("age").textContent = age;

    const pet = document.getElementById("pet");

    if(age < 5){
        pet.textContent = "🐣";
    }else if(age < 10){
        pet.textContent = "🐥";
    }else{
        pet.textContent = "🐤";
    }

    if(hunger <= 0 || happiness <= 0){
        alive = false;
        pet.textContent = "💀";
        document.getElementById("message").textContent =
            "Game Over! Your pet has passed away.";
    }
}

function feedPet(){
    if(!alive) return;

    hunger = Math.min(100, hunger + 25);
    document.getElementById("message").textContent =
        "Your pet enjoyed the food!";
    updateBars();
}

function playPet(){
    if(!alive) return;

    happiness = Math.min(100, happiness + 20);
    energy = Math.max(0, energy - 10);

    document.getElementById("message").textContent =
        "Your pet had fun playing!";
    updateBars();
}

function sleepPet(){
    if(!alive) return;

    energy = Math.min(100, energy + 35);

    document.getElementById("message").textContent =
        "Your pet took a nap!";
    updateBars();
}

setInterval(() => {

    if(!alive) return;

    hunger = Math.max(0, hunger - 4);
    happiness = Math.max(0, happiness - 3);
    energy = Math.max(0, energy - 2);

    age++;

    updateBars();

}, 3000);

updateBars();

</script>

</body>
</html>
